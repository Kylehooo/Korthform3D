<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}</style>
<title>Korthform3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: toolbar across the top · 3D workspace with a floating inspector · shape library rail on the right (bottom strip on phones) */
:root {
  --bg: #e8ebf0;
  --panel: #fbfcfd;
  --panel-2: #f0f2f6;
  --ink: #1b2130;
  --muted: #5a6374;
  --line: #d4d9e2;
  --accent: #2553d8;
  --accent-soft: #e2e8fb;
  --accent-ink: #ffffff;
  --danger: #c2412f;
  --vp-top: #f4f6f9;
  --vp-bottom: #d6dce5;
  --mat: #2e6a55;
  --mat-line: #dff3e8;
  --mat-edge: #235444;
  --hole: #9aa3ad;
  --hot: #e2600f;
  --shadow: 0 1px 2px rgba(20, 28, 45, .08), 0 10px 28px rgba(20, 28, 45, .12);
  --font-ui: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-label: "Barlow Semi Condensed", "Barlow", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121419; --panel: #1a1d24; --panel-2: #22262f; --ink: #e6e9ef; --muted: #9aa3b3; --line: #2e3440;
    --accent: #7d99ff; --accent-soft: #263152; --accent-ink: #0e1220; --danger: #ff7a66;
    --vp-top: #1d2129; --vp-bottom: #0f1115;
    --mat: #1f4a3c; --mat-line: #a6d8bf; --mat-edge: #17382e; --hole: #7f8896; --hot: #ff8a4c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121419; --panel: #1a1d24; --panel-2: #22262f; --ink: #e6e9ef; --muted: #9aa3b3; --line: #2e3440;
  --accent: #7d99ff; --accent-soft: #263152; --accent-ink: #0e1220; --danger: #ff7a66;
  --vp-top: #1d2129; --vp-bottom: #0f1115;
  --mat: #1f4a3c; --mat-line: #a6d8bf; --mat-edge: #17382e; --hole: #7f8896; --hot: #ff8a4c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; overflow: hidden; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* ---------- Top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 10px; padding: 8px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0;
}
.brand { display: flex; align-items: center; gap: 8px; flex: none; }
.brand svg { width: 26px; height: 26px; }
.wordmark { font-family: var(--font-label); font-weight: 700; font-size: 19px; letter-spacing: .02em; }
.doc-name {
  width: 190px; min-width: 90px; flex: 0 1 190px; border: 1px solid transparent; background: transparent;
  border-radius: 6px; padding: 5px 8px; font-weight: 500;
}
.doc-name:hover { border-color: var(--line); }
.doc-name:focus { border-color: var(--accent); background: var(--panel-2); outline: none; }
.save-state { font-size: 12px; color: var(--muted); white-space: nowrap; flex: none; }
.toolbar { display: flex; align-items: center; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.toolbar::-webkit-scrollbar { display: none; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 6px; flex: none; }
.icon-btn {
  display: inline-grid; place-items: center; width: 34px; height: 34px; flex: none;
  border: 0; border-radius: 7px; background: transparent; color: var(--ink);
}
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:hover:not(:disabled) { background: var(--panel-2); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.icon-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.icon-btn.sm { width: 28px; height: 28px; }
.icon-btn.sm svg { width: 17px; height: 17px; }
.text-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; flex: none;
  border: 1px solid var(--line); border-radius: 7px; background: var(--panel); font-weight: 500; white-space: nowrap;
}
.text-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.text-btn:hover { background: var(--panel-2); }
.text-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.text-btn.primary:hover { filter: brightness(1.06); }
.text-btn.danger { color: var(--danger); }

/* ---------- Workspace ---------- */
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) 236px; min-height: 0; }
.viewport {
  position: relative; overflow: hidden; min-width: 0; min-height: 0;
  background: linear-gradient(180deg, var(--vp-top), var(--vp-bottom));
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.view-tools { position: absolute; left: 14px; top: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
#cube { width: 104px; height: 104px; display: block; cursor: pointer; }
.view-btns { display: flex; flex-direction: column; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 3px; box-shadow: var(--shadow); }

.grid-bar {
  position: absolute; right: 14px; bottom: 14px; display: flex; align-items: center; gap: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 5px 6px 5px 12px; box-shadow: var(--shadow);
}
.grid-bar label { font-family: var(--font-label); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.grid-bar select { border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); padding: 4px 6px; font-family: var(--font-num); font-size: 12.5px; }
.grid-bar .text-btn { height: 28px; padding: 0 10px; font-size: 13px; }

.hint {
  position: absolute; left: 14px; bottom: 14px; max-width: min(460px, calc(100% - 330px));
  font-size: 12.5px; color: var(--hint, var(--muted)); line-height: 1.45; pointer-events: none;
}
.hint kbd, .help-table kbd {
  font-family: var(--font-num); font-size: 11px; padding: 1px 5px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
}

#marquee { position: absolute; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); pointer-events: none; }
#dims { position: absolute; inset: 0; pointer-events: none; }
.dim, #dragTag {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
  font-family: var(--font-num); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; box-shadow: var(--shadow);
}
.dim b { font-weight: 500; color: var(--muted); margin-right: 4px; }
#dragTag { transform: translate(14px, 14px); pointer-events: none; background: var(--ink); color: var(--panel); border-color: transparent; }

.boot {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px;
  color: var(--muted); font-size: 14px; pointer-events: none;
}
.boot strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

/* ---------- Inspector ---------- */
.inspector {
  position: absolute; right: 14px; top: 14px; width: 266px; max-height: calc(100% - 80px); overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px 14px;
}
.ins-head { display: flex; align-items: center; gap: 6px; }
.ins-name { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 3px 6px; margin-left: -6px; }
.ins-name:hover { border-color: var(--line); }
.ins-name:focus { border-color: var(--accent); outline: none; background: var(--panel-2); }
div.ins-name { padding-left: 0; margin-left: 0; }
.ins-kind { font-size: 12px; color: var(--muted); margin: 1px 0 10px; }
.inspector h3 {
  margin: 14px 0 6px; font-family: var(--font-label); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
  display: flex; justify-content: space-between;
}
.inspector h3 .unit { text-transform: none; letter-spacing: 0; font-family: var(--font-num); font-weight: 400; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 6px; padding: 6px 0; font-weight: 600; font-family: var(--font-label); font-size: 13px; letter-spacing: .03em; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg button.hole[aria-pressed="true"] { color: var(--ink); background-image: repeating-linear-gradient(45deg, transparent 0 5px, color-mix(in srgb, var(--hole) 35%, transparent) 5px 10px); }
.swatches { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
.sw { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); background: var(--c); padding: 0; }
.sw[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.sw.custom { position: relative; overflow: hidden; background: conic-gradient(#e0533d, #e7b52c, #3aa56b, #2f8fd8, #8a5bd6, #e0533d); cursor: pointer; }
.sw.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.fields3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.num { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); min-width: 0; }
.num span { padding: 0 0 0 7px; flex: none; font-family: var(--font-label); font-weight: 600; font-size: 12px; color: var(--muted); }
.num input { width: 100%; min-width: 0; border: 0; background: transparent; padding: 5px 6px; font-family: var(--font-num); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.num input:focus { outline: none; }
.num input::-webkit-inner-spin-button, .num input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.num input[type=number] { -moz-appearance: textfield; appearance: textfield; }
.num:focus-within { border-color: var(--accent); }
.param { display: grid; grid-template-columns: 1fr 72px; align-items: center; gap: 4px 8px; margin-bottom: 6px; }
.param > span { font-size: 12.5px; }
.param input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }
.param .num input { text-align: right; }
.ins-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.ins-actions .text-btn { height: 30px; padding: 0 9px; font-size: 13px; }

/* ---------- Dot tool ---------- */
#dotLabels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.dot-label {
  position: absolute; transform: translateY(-50%); font-family: var(--font-num); font-size: 11px; font-weight: 500; line-height: 16px;
  padding: 0 5px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-variant-numeric: tabular-nums;
}
.dot-label.sel { background: var(--hot); color: #fff; }
.dot-help { font-size: 12.5px; color: var(--muted); line-height: 1.45; margin: 8px 0 0; }
.ins-kind kbd { font-family: var(--font-num); font-size: 10.5px; padding: 0 4px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); }
.fields2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.fields2 h3 { margin-top: 12px; }
.dot-head, .dot-row { display: grid; grid-template-columns: 24px repeat(3, minmax(0, 1fr)) 26px; gap: 4px; align-items: center; }
.dot-head span { font-family: var(--font-label); font-weight: 600; font-size: 11px; color: var(--muted); text-align: center; }
.dot-list { display: flex; flex-direction: column; gap: 4px; max-height: 214px; overflow-y: auto; margin-top: 3px; padding-right: 2px; }
.dot-row .num input { padding: 4px 5px; font-size: 12px; text-align: right; }
.dot-idx { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-family: var(--font-num); font-size: 11px; font-weight: 500; }
.dot-row.sel .dot-idx { background: var(--hot); color: #fff; }
.dot-row.sel .num { border-color: color-mix(in srgb, var(--hot) 55%, var(--line)); }
#dotStatus:empty { display: none; }
.dot-status { margin-top: 10px; font-size: 12.5px; line-height: 1.45; padding: 7px 9px; border-radius: 7px; background: var(--panel-2); color: var(--muted); }
.dot-status.ok { color: var(--ink); background: var(--accent-soft); }
.dot-status.warn { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, var(--panel)); }
.inspector.dot-panel { width: 288px; }
/* ---------- Screw maker ---------- */
#screwTile svg { width: 56px; height: 56px; display: block; }
.library.dot-mode #screwTile { opacity: .35; pointer-events: none; }
.sm-sizes { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 5px; margin-bottom: 12px; }
.sm-size { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 7px 0; font-family: var(--font-num); font-size: 13px; font-weight: 500; }
.sm-size[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sm-grid select, .tfield select { border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); padding: 6px 7px; color: var(--ink); font-size: 13px; width: 100%; min-width: 0; }
.sm-spec { margin: 10px 0 12px; padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); font-size: 12.5px; line-height: 1.5; font-variant-numeric: tabular-nums; }
.sm-parts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.sm-part { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--panel); display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.sm-part.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.sm-check { margin: 0; }
.sm-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sm-row select { flex: 1 1 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); padding: 5px 6px; font-size: 12.5px; min-width: 0; }
.sm-row .num { flex: 1 1 110px; }
.sm-row .check { margin: 0; font-size: 12.5px; }
.num small { padding-right: 7px; color: var(--muted); font-size: 11px; }
.sm-note { margin: 0; font-size: 12px; color: var(--muted); }
.tgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.tfield { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; min-width: 0; }
.tfield > span:first-child { font-size: 12px; color: var(--muted); }
.tval { font-family: var(--font-num); font-size: 12.5px; padding: 6px 0; }
.match-line { margin-top: 10px; font-size: 12.5px; line-height: 1.45; padding: 7px 9px; border-radius: 7px; }
.match-line.ok { background: color-mix(in srgb, #2f9e62 14%, var(--panel)); color: var(--ink); }
.match-line.ok::before { content: "✓ "; color: #2f9e62; font-weight: 700; }
.match-line.bad { background: color-mix(in srgb, var(--danger) 12%, var(--panel)); color: var(--danger); }
.match-line.bad::before { content: "✕ "; font-weight: 700; }
.match-line.cut-hint { background: color-mix(in srgb, var(--hot) 12%, var(--panel)); color: var(--ink); }
.match-line.cut-hint .text-btn { display: flex; margin-top: 7px; }
.add-match { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 10px; }
.add-match > span { flex: 1 1 100%; font-family: var(--font-label); font-weight: 600; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.locked-size .num { opacity: .6; }
.check .ck-text { flex: 1 1 0; min-width: 0; }
.sm-engage { margin: 10px 0 0; font-size: 12.5px; line-height: 1.45; padding: 7px 9px; border-radius: 7px; background: color-mix(in srgb, #2f9e62 12%, var(--panel)); }
.sm-engage.warn { background: color-mix(in srgb, var(--danger) 12%, var(--panel)); color: var(--danger); }
@media (max-width: 520px) { .sm-parts { grid-template-columns: minmax(0, 1fr); } }
.curve-box { margin-top: 12px; padding: 4px 10px 6px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel-2); }
.curve-box h3 { margin-top: 8px; }
.curve-box .num { background: var(--panel); }
.curve-box .param { margin-bottom: 4px; }
.edge-lbl { font-family: var(--font-label); font-weight: 600; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 10px 0 5px; }
.seg.seg3 { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 8px; background: var(--panel); }
.seg.seg3 button { font-size: 12px; padding: 5px 2px; letter-spacing: 0; }
.seg.seg3 button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); box-shadow: none; }
.dot-idx.curvy { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--accent); }
.plane-ctrl { display: grid; grid-template-columns: 28px minmax(0, 1fr) 28px auto; gap: 4px; align-items: center; }
.plane-ctrl .step { border: 1px solid var(--line); background: var(--panel-2); font-family: var(--font-num); font-size: 16px; line-height: 1; }
.text-btn.xs { height: 28px; padding: 0 8px; font-size: 12.5px; }
.text-btn:disabled { opacity: .45; cursor: default; }
.check { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 7px; margin-top: 8px; font-size: 13px; cursor: pointer; }
.check input { accent-color: var(--accent); margin: 0; transform: translateY(1px); }
.check small { color: var(--muted); font-size: 11.5px; }
.inline-field { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
.inline-field h3 { margin: 0; }
.inline-field .num { width: 96px; flex: none; }
.plane-label {
  position: absolute; transform: translate(-100%, -50%); white-space: nowrap; font-family: var(--font-num); font-size: 11px; font-weight: 500;
  padding: 1px 6px; border-radius: 5px; background: var(--panel); color: var(--accent); border: 1px solid var(--accent);
}
.library.dot-mode .shape:not(#dotTile) { opacity: .35; pointer-events: none; }
#dotTile svg { width: 56px; height: 56px; display: block; }
.library.dot-mode #dotTile { background: var(--accent-soft); border-color: var(--accent); }

/* ---------- Theme button and picker ---------- */
.grid-bar .theme-btn { gap: 7px; padding: 0 11px 0 5px; }
.theme-btn i { display: block; width: 26px; height: 18px; border-radius: 5px; border: 2px solid var(--e, var(--mat-edge)); background-color: var(--m, var(--mat));
  background-image: linear-gradient(color-mix(in srgb, var(--l, var(--mat-line)) 70%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--l, var(--mat-line)) 70%, transparent) 1px, transparent 1px);
  background-size: 6px 6px; background-position: center; box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 14%, transparent), inset 0 1px 0 rgba(255, 255, 255, .28); }
.theme-pop { display: grid; grid-template-columns: repeat(3, 108px); gap: 8px; padding: 4px 6px 8px; }
.theme-pop .mat-sw { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 6px; width: auto; padding: 5px 5px 7px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 12.5px; text-align: center; transition: transform .12s, box-shadow .12s; }
.theme-pop .mat-sw i { display: grid; place-items: center; height: 54px; border-radius: 6px; background: linear-gradient(180deg, var(--b0), var(--b1)); overflow: hidden; }
.theme-pop .mat-sw i b { display: block; width: 62px; height: 62px; border: 4px solid var(--e); border-radius: 2px; background-color: var(--m);
  background-image: linear-gradient(color-mix(in srgb, var(--l) 60%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--l) 60%, transparent) 1px, transparent 1px);

  const seen = new Set();
  doc.nodes.forEach((n, i) => {
    seen.add(n.id);
    let v = views.get(n.id);
    if (!v) {
      v = { id: n.id, mesh: new THREE.Mesh(new THREE.BufferGeometry(), holeMat), geoKey: null, mat: solidMaterial(n.color) };
      v.mesh.userData.id = n.id;
      views.set(n.id, v);
      scene.add(v.mesh);
    }
    const key = geoKeyOf(n);
    if (v.geoKey !== key) { v.mesh.geometry = baseGeometry(n); v.geoKey = key; }
    v.mesh.position.fromArray(n.pos);
    v.mesh.quaternion.fromArray(n.quat);

    if (n.hole) {
      v.mesh.material = holeMat; v.mesh.castShadow = false; v.mesh.renderOrder = 2;

      if (v.xray) v.xray.visible = false;

    v.mesh.updateMatrixWorld(true);

    for (const id of solvePositions(drivers, solveOpts.force)) {
      const n = byId(id), v = views.get(id);
      if (n && v) { v.mesh.position.fromArray(n.pos); v.mesh.updateMatrixWorld(true); }
    }
  }
  updateSelectionBoxes();
  updateToolbar();
  requestRender();
}

/* ---------- open / close ---------- */

/* ---------- Fill ---------- */

  g.dispose();

  const old = t.editing ? byId(t.editing) : null;
  const node = {
    id: old?.id ?? newId(), kind: 'dots', name: old?.name ?? (t.mode === 'wrap' ? 'Dot shape' : 'Outline shape'),
    hole: old?.hole ?? false, color: old?.color ?? '#8a5bd6', params: {},
    pos: [c.x, c.y, c.z], quat: [0, 0, 0, 1], size: [...size], base: [...size], flip: [1, 1, 1], locked: false,
    dots: t.dots.map(d => [+(d.x - c.x).toFixed(4), +(d.y - c.y).toFixed(4), +(d.z - c.z).toFixed(4), +(d.bend || 0).toFixed(4), +(d.corner || 0).toFixed(4)]),
    mode: t.mode, height: t.height,

/* ---------- Mesh repair for export ----------

  nodes.forEach(n => { n.pos[0] = 0; n.pos[1] = 0; });

  if (!nodes.length) return;

function nudgeVector(e, step) {
  const d = new V3();

  nodes.forEach(n => { n.pos[0] += d.x; n.pos[1] += d.y; n.pos[2] += d.z; });

  // weld and close the seams CSG leaves behind, so slicers see watertight parts
  const parts = nodes.filter(n => !n.hole).map(n => {
    const g = printedGeometry(n, holes, cuts), p = g.attributes.position.array;
    g.dispose();
    return p.length / 9 > 300000 ? p : repairMesh(p).positions;
  });
  const tris = parts.reduce((a, p) => a + p.length / 9, 0);
  const buf = new ArrayBuffer(84 + tris * 50), dv = new DataView(buf);
  const head = new TextEncoder().encode('Korthform3D STL export, units: mm');
  new Uint8Array(buf, 0, 80).set(head.subarray(0, 80));
  dv.setUint32(80, tris, true);
  let o = 84;
  const a = new V3(), b = new V3(), c = new V3(), ab = new V3(), ac = new V3();
  for (const p of parts) {
    for (let i = 0; i < p.length; i += 9) {
      a.fromArray(p, i); b.fromArray(p, i + 3); c.fromArray(p, i + 6);
      ab.subVectors(b, a).cross(ac.subVectors(c, a)).normalize();
      for (const v of [ab, a, b, c]) { dv.setFloat32(o, v.x, true); dv.setFloat32(o + 4, v.y, true); dv.setFloat32(o + 8, v.z, true); o += 12; }
      dv.setUint16(o, 0, true); o += 2;
    }
  }
  return { buffer: buf, tris, cuts };
}
async function exportSTL(onlySelection) {
  const pool = onlySelection ? selectedNodes() : doc.nodes;
  const nodes = pool.filter(n => !n.hole);
  if (!nodes.length) { toast(pool.length ? 'Only holes are selected. Select the part they cut into and export that.' : 'Add a shape first.'); return; }
  toast('Preparing the STL…', 0);
  await nextFrame();
  let res;
  try { res = buildSTL(nodes); }
  catch (err) { console.error(err); toast('The STL couldn’t be built. Try grouping the holes into their parts first.'); return; }
  const cutHoles = new Set(res.cuts.flatMap(c => c.holes.map(h => h.id)));
  const note = cutHoles.size
    ? `Cut ${cutHoles.size} ungrouped hole${cutHoles.size > 1 ? 's' : ''} into ${[...new Set(res.cuts.map(c => c.solid.name))].join(', ')}.`
    : '';
  await saveFile(safeName(doc.name) + '.stl', res.buffer, note);
}

async function importSTL(file) {
  try {
    toast('Importing…', 0);
    const geo = new STLLoader().parse(await file.arrayBuffer());
    let g = geo.index ? geo.toNonIndexed() : geo;
    const pos = new Float32Array(g.attributes.position.array);
    if (!pos.length) throw new Error('empty');
    g.computeBoundingBox();
    const c = g.boundingBox.getCenter(new V3()), s = g.boundingBox.getSize(new V3());
    for (let i = 0; i < pos.length; i += 3) { pos[i] -= c.x; pos[i + 1] -= c.y; pos[i + 2] -= c.z; }
    const key = 'm' + newId();
    meshStore.set(key, pos);
    const size = [s.x, s.y, s.z].map(v => Math.max(v, 0.01));
    const n = { id: newId(), kind: 'mesh', name: file.name.replace(/\.stl$/i, '') || 'Mesh', hole: false, color: '#8fa0b3', params: {},
      pos: [0, 0, size[2] / 2], quat: [0, 0, 0, 1], size: [...size], base: [...size], flip: [1, 1, 1], meshKey: key, locked: false };
    doc.nodes.push(n);
    selection = new Set([n.id]);
    syncScene(); onSelectionChanged(); commit();
    toast(`Imported ${n.name}: ${fmt(size[0], 1)} × ${fmt(size[1], 1)} × ${fmt(size[2], 1)} mm, ${Math.round(pos.length / 9).toLocaleString()} triangles.`, 4200);
    if (Math.max(...size) > Math.max(doc.grid.w, doc.grid.d) * 2) setTimeout(fitView, 50);
  } catch (err) {
    console.error(err);
    toast('That file couldn’t be read as an STL.');
  }
}

/* =========================================================================
   My designs: your Claude account when the page runs as an artifact,
   otherwise this browser's storage.
   ========================================================================= */
const Store = {
  mode: 'local', col: null, ready: null,
  init() {
    return (this.ready ??= (async () => {
      const [db, user] = await Promise.all([capability('db'), capability('user')]);
      const uid = user ? await user.id().catch(() => null) : null;
      if (db && uid) { this.col = db.doc(`data/users/${uid}/profile`).collection('designs'); this.mode = 'cloud'; }
    })());
  },
  localIndex() { return safeStorage(() => JSON.parse(localStorage.getItem('korthform3d:designs') || '[]'), []) || []; },
  async list() {
    await this.init();
    if (this.mode === 'cloud') {
      const snap = await this.col.get();
      return snap.docs.map(d => { const b = d.data(); return { id: d.id, name: b.name, updated: b.updated, count: b.count }; }).sort((a, b) => b.updated - a.updated);
    }
    return this.localIndex().sort((a, b) => b.updated - a.updated);
  },
  async save(id, meta, json) {
    await this.init();
    if (this.mode === 'cloud') {
      if (json.length > 240000) throw Object.assign(new Error('too large'), { code: 'too_large' });
      await this.col.doc(id).set({ ...meta, data: json });
      return 'cloud';
    }
    const ok = safeStorage(() => {
      localStorage.setItem('korthform3d:design:' + id, json);
      const idx = this.localIndex().filter(d => d.id !== id);
      idx.push({ id, ...meta });
      localStorage.setItem('korthform3d:designs', JSON.stringify(idx));
      return true;
    }, false);
    if (!ok) throw Object.assign(new Error('storage full'), { code: 'quota' });
    return 'local';
  },
  async load(id) {
    await this.init();
    if (this.mode === 'cloud') { const d = await this.col.doc(id).get(); if (!d.exists) throw new Error('missing'); return d.data().data; }
    const s = safeStorage(() => localStorage.getItem('korthform3d:design:' + id));
    if (!s) throw new Error('missing');
    return s;
  },
  async remove(id) {
    await this.init();
    if (this.mode === 'cloud') { await this.col.doc(id).delete(); return; }
    safeStorage(() => {
      localStorage.removeItem('korthform3d:design:' + id);
      localStorage.setItem('korthform3d:designs', JSON.stringify(this.localIndex().filter(d => d.id !== id)));
    });
  },
};
async function saveDesign() {
  doc.name = $('#docName').value.trim() || 'Untitled design';
  const data = serializeDesign(), json = JSON.stringify(data);
  try {
    const mode = await Store.save(doc.id, { name: doc.name, updated: data.updated, count: doc.nodes.length }, json);
    dirty = false; savedTo = mode;
    updateToolbar(); scheduleDraftSave();
    toast(mode === 'cloud' ? `Saved “${doc.name}” to My designs.` : `Saved “${doc.name}” in this browser.`);
    return true;
  } catch (err) {
    console.error(err);
    toast(err.code === 'too_large' ? 'This design is too big for My designs (imported meshes add a lot). Use Export → Design file instead.'
      : err.code === 'quota' ? 'Browser storage is full. Use Export → Design file instead.'
      : 'Saving didn’t work. Use Export → Design file to keep a copy.', 5000);
    return false;
  }
}
function relTime(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
async function openDesigns() {
  openModal(`<h2>My designs</h2><p class="sub" id="dsSub">Loading…</p>
    <div class="design-list" id="dsList"><div class="empty-list">Loading your designs…</div></div>
    <div class="modal-actions">
      <button class="text-btn" id="dsFile">${ICON.import} Open file…</button>
      <button class="text-btn" id="dsNew">${ICON.new} New design</button>
      <button class="text-btn primary" id="dsSave">${ICON.save} Save current</button>

    $('#dsNew', card).addEventListener('click', () => { closeModal(); newDesign(); });

async function refreshDesignList() {
  const list = $('#dsList'), sub = $('#dsSub');
  if (!list) return;
  let items;
  try { items = await Store.list(); }
  catch (err) { console.error(err); list.innerHTML = '<div class="empty-list">Your designs couldn’t be loaded right now.</div>'; return; }
  if (!$('#dsList')) return;
  sub.textContent = Store.mode === 'cloud'
    ? 'Stored with your Claude account, so they’re here whenever you open Korthform3D.'
    : 'Stored in this browser only. Export a design file to keep a copy anywhere else.';
  if (!items.length) { list.innerHTML = '<div class="empty-list">No saved designs yet.<br>Press <b>Save current</b> to keep this one.</div>'; return; }
  list.innerHTML = items.map(d => `<div class="design-row ${d.id === doc.id ? 'current' : ''}">
      <div class="meta"><strong>${esc(d.name || 'Untitled')}</strong><small>${d.count ?? 0} shape${d.count === 1 ? '' : 's'} · ${relTime(d.updated)}${d.id === doc.id ? ' · open now' : ''}</small></div>
      <button class="text-btn" data-open="${esc(d.id)}">Open</button>
      <button class="text-btn danger" data-del="${esc(d.id)}" aria-label="Delete ${esc(d.name)}">${ICON.del}</button></div>`).join('');
  $$('[data-open]', list).forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.open;
    confirmDiscard(async () => {
      try {
        const json = await Store.load(id);
        loadDesign(JSON.parse(json));
        dirty = false; savedTo = Store.mode; updateToolbar(); scheduleDraftSave(); closeModal(); goHome();
        toast(`Opened ${doc.name}.`);
      } catch (err) { console.error(err); toast('That design couldn’t be opened.'); }
    });
  }));
  $$('[data-del]', list).forEach(b => b.addEventListener('click', async () => {
    if (b.dataset.armed) {
      try { await Store.remove(b.dataset.del); if (b.dataset.del === doc.id) { savedTo = null; dirty = true; updateToolbar(); } refreshDesignList(); }

    }
    b.dataset.armed = '1'; b.textContent = 'Delete?';
    setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.innerHTML = ICON.del; } }, 3000);
  }));
}

/* =========================================================================
   Keyboard
   ========================================================================= */
window.addEventListener('keydown', e => {
  if (!$('#modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  const t = e.target, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable;
  if (typing) { if (t.tagName === 'INPUT' && (e.key === 'Enter' || e.key === 'Escape')) t.blur(); return; }
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (dotTool.active) {
    if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? dotRedo() : dotUndo(); }
    else if (mod && k === 'y') { e.preventDefault(); dotRedo(); }
    else if (mod) return;
    else if (e.key === 'Enter') { e.preventDefault(); fillDots(); }
    else if (e.key === 'Escape') { if (ptr?.mode === 'dot') cancelDotDrag(); else closeDotTool(); }
    else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteDot(dotTool.sel >= 0 ? dotTool.sel : dotTool.dots.length - 1); }
    else if (e.key.startsWith('Arrow')) { e.preventDefault(); nudgeDot(e); }
    else if (k === 'p') closeDotTool();
    else if (k === 'w') setDotMode('wrap');
    else if (k === 'o') setDotMode('outline');
    else if (k === 'f') fitView();
    else if (e.code === 'BracketRight' || e.key === 'PageUp') { e.preventDefault(); stepDotPlane(1, e.shiftKey); }
    else if (e.code === 'BracketLeft' || e.key === 'PageDown') { e.preventDefault(); stepDotPlane(-1, e.shiftKey); }
    else if (k === 'g') setDotGrid(!dotTool.showGrid);
    else if (e.key === '?') openHelp();
    return;
  }
  if (dimTool.active) {
    if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (mod && k === 'y') { e.preventDefault(); redo(); }
    else if (mod && k === 's') { e.preventDefault(); saveDesign(); }
    else if (mod || e.altKey) return;
    else if (e.key === 'Escape' || k === 'k') closeDimTool();
    else if (e.key === 'Enter') { e.preventDefault(); dimAdd(); }
    else if (k === 'f') fitView();
    else if (e.key === '?') openHelp();
    return;
  }
  if (e.key.startsWith('Arrow')) { if (selection.size) { e.preventDefault(); arrowNudge(e); } return; }
  if (mod) {
    const map = { z: () => (e.shiftKey ? redo() : undo()), y: redo, d: duplicate, g: () => (e.shiftKey ? ungroupSelection() : groupSelection()), a: selectAll, s: saveDesign };
    if (map[k]) { e.preventDefault(); map[k](); }
    else if (k === 'c') copySel();
    else if (k === 'v') paste();
    return;
  }
  if (e.altKey) return;
  switch (e.key) {
    case 'Delete': case 'Backspace': e.preventDefault(); deleteSel(); break;
    case 'Escape': if (ptr) cancelDrag(); else if (!$('#menu').hidden) hideMenu(); else { selection.clear(); onSelectionChanged(); } break;
    case 'h': case 'H': setHole(true); break;
    case 's': case 'S': setHole(false); break;
    case 'd': case 'D': dropToMat(); break;
    case 'l': case 'L': openAlignMenu(); break;
    case 'm': case 'M': openMirrorMenu(); break;
    case 'f': case 'F': fitView(); break;
    case 'c': case 'C': centerOnMat(); break;
    case 'p': case 'P': openDotTool(); break;
    case 'k': case 'K': openDimTool(); break;
    case '?': openHelp(); break;
  }
});

  window.korthform3d = { doc, THREE, buildSTL, makeZip, csgCombine, serializeDesign, selection: () => selection, select: ids => { selection = new Set(ids); onSelectionChanged(); }, groupSelection, ungroupSelection, commit, syncScene, undo, redo, centerOnMat, centerTogether, looseHolesIn, cutIn, dotTool, buildDotsGeometry, openDotTool, Dot, makeThreadNode, threadCheck, updateThread, METRIC, openScrewMaker, smState, setMatTheme, matTheme: () => matTheme, MAT_THEMES, dimTool, openDimTool, closeDimTool, dimPick, dimAdd, dimDraft, addRel, setRelValue, setRelLocked, removeRel, relMeasure, relValue, badRels, coord, rels: () => doc.rels, relLabels: () => relVis.items.map(it => ({ id: it.r.id, text: it.text, cls: it.cls, ...toScreen(it.pos) })), loadDesign, deleteSel, duplicate, byId, dotMids: () => midMeshes.map(m => toScreen(m.position)),
